services:
  lis:
    build: .
    container_name: lis-analyser-receiver
    ports:
      - "8000:8000"   # HTTP API + /docs
      - "2575:2575"   # MLLP TCP for the analyser
    environment:
      LIS_DB_PATH: /data/lis.db
      LIS_MLLP_HOST: 0.0.0.0
      LIS_MLLP_PORT: "2575"
      # Default per-row pause (ms) of a background mapping recompute.  The
      # sleep happens outside every database lock, so MLLP ingestion is never
      # blocked.  Each PUT /api/v1/standard/mapping may override with
      # delay_ms; 0 is the production-safe default.
      LIS_RECALC_DELAY_MS: "0"
    volumes:
      - lis-data:/data
    restart: unless-stopped

volumes:
  lis-data:
